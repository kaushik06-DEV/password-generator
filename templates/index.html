<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Password Generator</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Arial, sans-serif; background: #f0f2f5; display: flex; justify-content: center; align-items: center; height: 100vh; }
    .card { background: white; padding: 2rem; border-radius: 12px; width: 380px; box-shadow: 0 2px 12px rgba(0,0,0,0.1); }
    h1 { font-size: 22px; margin-bottom: 1.5rem; color: #1a1a1a; }
    label { font-size: 14px; color: #555; display: block; margin-bottom: 4px; }
    input[type="number"] { width: 100%; padding: 8px 12px; border: 1px solid #ddd; border-radius: 8px; margin-bottom: 1rem; font-size: 14px; }
    .checkbox-row { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; font-size: 14px; color: #333; }
    button { width: 100%; padding: 10px; background: #1d9e75; color: white; border: none; border-radius: 8px; font-size: 15px; cursor: pointer; margin-top: 1rem; }
    button:hover { background: #0f6e56; }
    .result { margin-top: 1.5rem; background: #f0f2f5; padding: 12px 16px; border-radius: 8px; font-size: 15px; font-family: monospace; word-break: break-all; color: #1a1a1a; }
    .result-label { font-size: 12px; color: #888; margin-bottom: 4px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>🔐 Password Generator</h1>
    <form method="POST">
      <label>Password Length</label>
      <input type="number" name="length" min="4" max="32" value="12">

      <div class="checkbox-row">
        <input type="checkbox" name="uppercase" id="uppercase" checked>
        <label for="uppercase">Include Uppercase (A-Z)</label>
      </div>
      <div class="checkbox-row">
        <input type="checkbox" name="numbers" id="numbers" checked>
        <label for="numbers">Include Numbers (0-9)</label>
      </div>
      <div class="checkbox-row">
        <input type="checkbox" name="symbols" id="symbols">
        <label for="symbols">Include Symbols (!@#...)</label>
      </div>

      <button type="submit">Generate Password</button>
    </form>

    {% if password %}
    <div class="result">
      <div class="result-label">Your password</div>
      {{ password }}
    </div>
    {% endif %}
  </div>
</body>
</html>
